<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(config|includes|database|scripts|tests|docs|deploy|ml|storage)(/|$)">
    Require all denied
</DirectoryMatch>
# Render termina TLS en su proxy y entrega la petición al contenedor.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
